<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">TapLoop configuration screen mockup</title><desc id="desc">A mobile settings screen showing tap interval slider and repeat limit options.</desc>
  <rect width="390" height="844" rx="34" fill="#F1F4FA"/><text x="26" y="34" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17191F">9:41</text><text x="318" y="34" font-family="Arial,sans-serif" font-size="13" fill="#17191F">●  Wi-Fi  ▰</text>
  <text x="24" y="90" font-family="Arial,sans-serif" font-size="17" fill="#155EEF">‹  Back</text><text x="24" y="150" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17191F">Tap configuration</text>
  <text x="24" y="181" font-family="Arial,sans-serif" font-size="13" fill="#747987">Choose a comfortable pace. Stop at any time</text><text x="24" y="199" font-family="Arial,sans-serif" font-size="13" fill="#747987">from the floating bar.</text>
  <rect x="20" y="226" width="350" height="394" rx="24" fill="white"/>
  <text x="42" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17191F">Tap interval</text><text x="42" y="302" font-family="Arial,sans-serif" font-size="14" fill="#155EEF">500 ms between taps</text>
  <rect x="44" y="329" width="300" height="6" rx="3" fill="#DDE2EB"/><rect x="44" y="329" width="44" height="6" rx="3" fill="#155EEF"/><circle cx="88" cy="332" r="10" fill="#155EEF"/><text x="44" y="359" font-family="Arial,sans-serif" font-size="11" fill="#747987">Faster</text><text x="344" y="359" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#747987">Slower</text>
  <path d="M42 390H348" stroke="#E8EBF1"/>
  <text x="42" y="431" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17191F">Stop after</text><text x="42" y="461" font-family="Arial,sans-serif" font-size="13" fill="#747987">Keep running until you stop</text>
  <rect x="42" y="483" width="74" height="38" rx="19" fill="#EAF0FF" stroke="#155EEF"/><text x="79" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#155EEF">Manual</text>
  <rect x="124" y="483" width="64" height="38" rx="19" fill="white" stroke="#CDD2DC"/><text x="156" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#4F5561">25 taps</text>
  <rect x="196" y="483" width="72" height="38" rx="19" fill="white" stroke="#CDD2DC"/><text x="232" y="507" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#4F5561">100 taps</text>
  <text x="24" y="671" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17191F">Target position</text><text x="24" y="700" font-family="Arial,sans-serif" font-size="13" fill="#747987">The target starts near the center. Drag the crosshair</text><text x="24" y="719" font-family="Arial,sans-serif" font-size="13" fill="#747987">after you start the floating controls.</text>
  <rect x="0" y="782" width="390" height="62" fill="white"/><text x="64" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#858A95">⌂  Home</text><text x="195" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#155EEF">⚙  Configuration</text><text x="326" y="817" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#858A95">▤  Guide</text>
</svg>
